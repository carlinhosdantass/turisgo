<div class="page-container auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Criar Conta</h2>
        
        <form onsubmit="fazerCadastro(event)" class="auth-form">
            <input type="text" id="cad-nome" class="form-input" placeholder="Seu nome completo" required>
            <input type="email" id="cad-email" class="form-input" placeholder="Seu e-mail" required>
            <input type="password" id="cad-senha" class="form-input" placeholder="Crie uma senha" required>
            <button type="submit" class="btn-orange btn-full">Cadastrar</button>
        </form>
    </div>
</div>
