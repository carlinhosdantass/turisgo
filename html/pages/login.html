<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - GoTurismos</title>
</head>

<body>

<main>
  <section>
    <h1>Realize o login e explore com a gente!</h1>

    <h2>Dados pessoais</h2>

    <form>
      <label>E-mail *</label>
      <input type="email" placeholder="Digite seu e-mail...">

      <label>Senha *</label>
      <input type="password" placeholder="Digite sua senha...">

      <button type="submit">Fazer login</button>
    </form>

    <p>
      Ainda não tem conta?
      <a href="#">Realizar cadastro</a>
    </p>
  </section>
</main>

</body>
</html>
