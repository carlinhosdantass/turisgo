<div class="page-container auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Acessar Conta</h2>
        
        <form onsubmit="fazerLogin(event)" class="auth-form">
            <input type="email" id="login-email" class="form-input" placeholder="Seu e-mail" required>
            <input type="password" id="login-senha" class="form-input" placeholder="Sua senha" required>
            <button type="submit" class="btn-orange btn-full">Entrar</button>
        </form>

        <p class="auth-footer">
            Não tem uma conta? <a href="#" onclick="event.preventDefault(); loadContent('html/pages/cadastro.html', 'content')" class="auth-link">Cadastre-se</a>
        </p>
    </div>
</div>
